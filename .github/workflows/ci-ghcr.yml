name: ci-ghcr

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      CI_TAG: ${{ steps.step_setup_env.outputs.CI_TAG }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Configure environment variables
      id: step_setup_env
      run: |
        echo "CI_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "CI_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    - name: Install Yarn package manager
      run: npm install -g yarn
    - name: Install necessary dependencies and perform initial checks
      run: |
        yarn up
        yarn install
        yarn lint
        yarn test
    - name: Run "build" script
      if: github.ref_type == 'tag'
      run: yarn run build
    - name: Prepare artifact
      run: |
        mkdir -p ${{ github.workspace }}/artifact
        tar -zcvf ${{ github.workspace }}/artifact/ci.tar.gz --directory dist cncjs
      continue-on-error: true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ci-artifact
        path: |
          artifact/ci.tar.gz
        if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure environment variables
      env:
        CI_TAG: "${{ needs.build.outputs.CI_TAG }}"
      run: |
        echo "CI_TAG=${CI_TAG}" >> $GITHUB_ENV
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ci-artifact
        path: artifact
    - name: Extract artifact
      run: |
        mkdir -p dist
        tar -zxvf artifact/ci.tar.gz --directory dist
    - name: Set Docker image tag
      run: echo "DOCKER_IMAGE_TAG=$(echo $CI_TAG | sed -e 's/\//-/g')" >> $GITHUB_ENV
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/cncjs:${{ env.DOCKER_IMAGE_TAG }}
          ghcr.io/${{ github.repository_owner }}/cncjs:latest
